# Belief system
belief:
  parcel_ttl_mult: 20
  agent_ttl_mult: 10
  # P_alive = exp(-age_steps / horizon). ~15 steps ≈ 1.5s.
  # parcel_ttl_mult must be >> expected_steal_horizon_steps (practical min 3×).
  expected_steal_horizon_steps: 15
  agent_grace_steps: 3
  agent_blocking_trust_threshold: 0.5
  parcel_belief_stale_steps: 4

# Intention layer
intention:
  # A value-based alternative must beat the current intention by this fraction to switch.
  switch_margin_fraction: 0.25
  max_move_fail_streak: 3
  max_age_steps: 50
  opponent_defer_steps: 3   # defer a crate push while an opponent is within this many tiles
  l_seed_efficiency: 0.5    # fraction of rewardAvg seeded as the L-throughput floor
  hysteresis_pct: 0.05      # single switching-cost threshold: G3, L3 dispatch/abort (§5.8, §5.9)
  steal_prob: 0.3           # behavioral uncertainty in steal_risk (§5.9)

# Exploration
explore:
  spawn_observed_ttl_steps: 100
  # Explore succeeds when target is in FOV AND Manhattan distance ≤ this value.
  termination_distance: 2
  # Both-explore hysteresis: a fresh spawn must be this many steps nearer to switch.
  switch_distance_margin: 2
  # cost += competitor_penalty_alpha * competitorWeight(spawn)
  competitor_penalty_alpha: 3
  # weight(t) = weight(0) * exp(-Δsteps / memory_decay_horizon_steps)
  memory_decay_horizon_steps: 50
  ev_promote: false          # A/B: promote explore-EV from 0 to §5.4 formula

# Race-aware utility: P_steal = 1 - exp(-margin / horizon_steps)
race:
  horizon_steps: 2

# Loop timing
loop:
  ready_poll_ms: 50
  no_step_wait_ms: 200

# Mission brain
mission:
  resolver_max_steps: 10

# Crate-aware PDDL planning (ENHSP). Falls back to wall-only behaviour if disabled.
crates:
  enabled: true          # set false to treat crate tiles as static walls
  cooldown_ms: 3000      # min ms between PDDL calls for the same target

# Logging: silent | info | debug
log:
  level: info
